<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ariqo Banyusila Abrar - AI Engineer and App Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170e07"/>
      <stop offset="0.5" stop-color="#241606"/>
      <stop offset="1" stop-color="#0d0904"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#6b4416" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#402910" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#402910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEBBE"/>
      <stop offset="0.5" stop-color="#F0C060"/>
      <stop offset="1" stop-color="#D3922A"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D3922A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F0C060"/>
      <stop offset="1" stop-color="#D3922A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF0F2"/>
      <stop offset="0.5" stop-color="#46C7D0"/>
      <stop offset="1" stop-color="#1E7E8C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gemglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Art Nouveau corner flourish (drawn for top-left, reused/mirrored) -->
    <g id="flourish" fill="none" stroke="#F0C060" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55">
      <path d="M 4 118 C 4 52 46 10 132 16" stroke-dasharray="230" stroke-dashoffset="230">
        <animate attributeName="stroke-dashoffset" values="230;0" dur="1.6s" begin="0.2s" fill="freeze"/>
      </path>
      <path d="M 10 116 C 34 92 52 74 48 44 C 45 24 27 20 21 33 C 16 44 30 50 37 40" stroke-dasharray="150" stroke-dashoffset="150">
        <animate attributeName="stroke-dashoffset" values="150;0" dur="1.6s" begin="0.5s" fill="freeze"/>
      </path>
      <circle cx="132" cy="16" r="3.2" fill="#F0C060" stroke="none"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="24" r="2.2" fill="#F0C060" stroke="none" fill-opacity="0.8"/>
      <circle cx="92" cy="17" r="1.6" fill="#F0C060" stroke="none" fill-opacity="0.7"/>
    </g>
  </defs>

  <!-- background + glow -->
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- faint letter/paper panel behind name (the 'surat' motif) -->
  <rect x="250" y="70" width="500" height="120" rx="4" fill="#F5E6C8" fill-opacity="0.03" stroke="#F0C060" stroke-opacity="0.10"/>

  <!-- four corner flourishes -->
  <use href="#flourish" transform="translate(26,22)"/>
  <use href="#flourish" transform="translate(974,22) scale(-1,1)"/>
  <use href="#flourish" transform="translate(26,278) scale(1,-1)"/>
  <use href="#flourish" transform="translate(974,278) scale(-1,-1)"/>

  <!-- floating golden light motes -->
  <g fill="#F0C060">
    <circle cx="150" cy="240" r="2.4"><animate attributeName="cy" values="270;40" dur="7.5s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7.5s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="240" r="1.6"><animate attributeName="cy" values="270;55" dur="9.5s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9.5s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="240" r="2.2"><animate attributeName="cy" values="270;45" dur="8s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="8s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="240" r="1.5"><animate attributeName="cy" values="270;60" dur="10.5s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10.5s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="240" r="2.6"><animate attributeName="cy" values="270;35" dur="8.8s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8.8s" begin="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <g filter="url(#soft)">
    <text x="500" y="140" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="bold" letter-spacing="1.5" fill="url(#gold)">Ariqo Banyusila Abrar</text>
  </g>
  <!-- sheen sweep over the name -->
  <clipPath id="nameClip"><text x="500" y="140" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="bold" letter-spacing="1.5">Ariqo Banyusila Abrar</text></clipPath>
  <g clip-path="url(#nameClip)">
    <rect x="-260" y="80" width="170" height="90" transform="skewX(-18)" fill="url(#sheen)">
      <animate attributeName="x" values="-260;1080" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- subtitle with typing reveal -->
  <clipPath id="subReveal"><rect x="250" y="158" width="0" height="34"><animate attributeName="width" values="0;500" dur="1.7s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/></rect></clipPath>
  <g clip-path="url(#subReveal)">
    <text x="500" y="182" text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-size="20" letter-spacing="4" fill="#F5E6C8">AI Engineer&#160;&#160;&#183;&#160;&#160;App Builder</text>
  </g>

  <!-- ornamental divider with emerald brooch centerpiece -->
  <g transform="translate(500,222)">
    <path d="M -170 0 L -34 0" stroke="url(#goldline)" stroke-width="2" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" values="140;0" dur="1.3s" begin="1.5s" fill="freeze"/></path>
    <path d="M 170 0 L 34 0" stroke="url(#goldline)" stroke-width="2" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" values="140;0" dur="1.3s" begin="1.5s" fill="freeze"/></path>
    <circle cx="-34" cy="0" r="2.4" fill="#F0C060"/>
    <circle cx="34" cy="0" r="2.4" fill="#F0C060"/>
    <!-- radiating gold rays -->
    <g stroke="#F0C060" stroke-width="1" stroke-opacity="0.5">
      <line x1="0" y1="-20" x2="0" y2="-27"/><line x1="0" y1="20" x2="0" y2="27"/>
      <line x1="-20" y1="0" x2="-27" y2="0"/><line x1="20" y1="0" x2="27" y2="0"/>
      <line x1="-14" y1="-14" x2="-19" y2="-19"/><line x1="14" y1="14" x2="19" y2="19"/>
      <line x1="14" y1="-14" x2="19" y2="-19"/><line x1="-14" y1="14" x2="-19" y2="19"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <!-- emerald gem (brooch) -->
    <g filter="url(#gemglow)">
      <path d="M 0 -15 L 11 0 L 0 15 L -11 0 Z" fill="url(#gem)" stroke="#CFF6F7" stroke-width="0.8" stroke-opacity="0.7"/>
      <path d="M 0 -15 L 0 15 M -11 0 L 11 0" stroke="#0d5560" stroke-width="0.6" stroke-opacity="0.5"/>
      <circle cx="-3.5" cy="-4.5" r="1.8" fill="#ffffff" fill-opacity="0.9"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- letter-writing tagline (Violet Evergarden nod) -->
  <text x="500" y="272" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" font-style="italic" letter-spacing="2.5" fill="#a07d4c">&#8220; menulis kode, seperti menulis surat &#8221;</text>
</svg>
